<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="45%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8F6E35"/>
    </linearGradient>
  </defs>

  <!-- Dark Luxury Slate Base -->
  <rect width="64" height="64" rx="16" fill="#0A0A0B"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#C9A96E" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- Celestial Interlocking Rings -->
  <ellipse cx="32" cy="32" rx="22" ry="9.5" fill="none" stroke="url(#gold)" stroke-width="2.4" transform="rotate(-28 32 32)"/>
  <ellipse cx="32" cy="32" rx="21" ry="8" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-dasharray="2 3" stroke-opacity="0.8" transform="rotate(35 32 32)"/>

  <!-- Core Radiant Star / Monogram Core -->
  <circle cx="32" cy="32" r="4.5" fill="url(#gold)"/>
  <circle cx="47" cy="23" r="2.2" fill="#FFF2D6"/>
  <circle cx="17" cy="41" r="1.6" fill="#C9A96E"/>
</svg>
